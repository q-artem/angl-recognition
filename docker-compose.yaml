services:
  angl-recognition:
    container_name: angl-recognition
    build: "."
    restart: "always"

    volumes:
      - ./data:/usr/src/app/data

    networks:
      - proxy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    name: vpn-proxy-network
    external: true
